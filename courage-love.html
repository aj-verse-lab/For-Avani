<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #4b2c6f, #1b0f2e);
  font-family: 'Courier New', monospace;
  color: #ffe9f3;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  max-width: 520px;
  padding: 24px;
  text-align: center;
}

.terminal {
  background: rgba(0,0,0,0.35);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 0 30px rgba(255,182,193,0.15);
}

.ascii {
  white-space: pre;
  font-size: 12px;
  color: #ffb6c1;
  margin-bottom: 18px;
}

.text {
  font-size: 15px;
  line-height: 1.9;
  min-height: 120px;
}

button {
  margin-top: 22px;
  padding: 10px 26px;
  border-radius: 20px;
  border: none;
  background: #ffb6c1;
  color: #2c1020;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="terminal">
    
<div class="ascii">
  *****     *****  
 *******   ******* 
********* *********
*******************
 *****************
  ***************
    ***********
      *******
        ***
         *
</div>

    <div class="text" id="text"></div>

    <button id="btn" onclick="next()">Continue</button>
  </div>
</div>

<script>
const lines = [
  "Sometimes love feels scary.",
  "Sometimes it feels unfamiliar.",
  "Sometimes it makes your heart race for reasons you cannot explain.",
  "",
  "Courage was scared too.",
  "But he stayed.",
  "He protected what he loved.",
  "Even when his paws were shaking.",
  "",
  "That is how I love you.",
  "Not loudly.",
  "Not fearlessly.",
  "But honestly.",
  "",
  "Even when life feels strange.",
  "Even when days are uncertain.",
  "Even when distance exists.",
  "",
  "I choose you.",
  "",
  "I love you, Avani 🤍"
];

let i = 0;
const text = document.getElementById("text");
const btn = document.getElementById("btn");

function next() {
  if (i < lines.length) {
    text.innerHTML += lines[i] + "<br>";
    i++;
  } else {
    btn.style.display = "none";
  }
}
</script>

</body>
</html>
