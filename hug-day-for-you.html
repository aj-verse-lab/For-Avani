<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hug Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #2a1f2d, #0d0b10);
  font-family: 'Georgia', serif;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* soft floating warmth */
.warm {
  position: absolute;
  width: 5px;
  height: 5px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); opacity: 0; }
  to { transform: translateY(-10vh); opacity: 0.7; }
}

.card {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(18px);
  border-radius: 32px;
  padding: 42px;
  width: 90%;
  max-width: 460px;
  text-align: center;
  z-index: 2;
}

h1 {
  font-size: 22px;
  font-weight: normal;
  margin-bottom: 18px;
}

.hug {
  font-size: 58px;
  margin-bottom: 18px;
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.text {
  font-size: 16px;
  line-height: 2;
  min-height: 150px;
  opacity: 0;
  transition: opacity 0.9s ease;
}

button {
  margin-top: 30px;
  padding: 12px 34px;
  border-radius: 30px;
  border: none;
  background: #f2c6d4;
  color: #2c2c2c;
  font-size: 15px;
  cursor: pointer;
}

.final {
  display: none;
  font-size: 16px;
  line-height: 2.1;
  margin-top: 26px;
  animation: fadeIn 2.2s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="card">
  <h1>Happy Hug Day 🤍</h1>

  <div class="hug">🤍</div>

  <div class="text" id="text"></div>

  <button id="btn" onclick="next()">Come closer</button>

  <div class="final" id="finalText">
    This is the hug I would give you.<br><br>
    Not rushed.<br>
    Not loose.<br><br>
    The kind where you can breathe.<br>
    The kind where you feel safe enough to stay.<br><br>
    Until I can hold you for real,<br>
    let this be my arms around you.<br><br>
    Happy Hug Day, Avani 🤍
  </div>
</div>

<script>
// floating warmth dots
for (let i = 0; i < 40; i++) {
  const w = document.createElement("div");
  w.className = "warm";
  w.style.left = Math.random() * 100 + "vw";
  w.style.animationDuration = (18 + Math.random() * 22) + "s";
  w.style.animationDelay = Math.random() * 20 + "s";
  document.body.appendChild(w);
}

const lines = [
  "If I were with you right now.",
  "I would not say much.",
  "I would just pull you close.",
  "Let you rest your head.",
  "Let the world slow down around us.",
  "You would not have to explain anything.",
  "You would just feel held.",
  "That is how you feel to me."
];

let i = 0;
const text = document.getElementById("text");
const btn = document.getElementById("btn");
const finalText = document.getElementById("finalText");

function next() {
  text.style.opacity = 0;

  setTimeout(() => {
    if (i < lines.length) {
      text.innerText = lines[i];
      text.style.opacity = 1;
      i++;
    } else {
      btn.style.display = "none";
      finalText.style.display = "block";
    }
  }, 300);
}

next();
</script>

</body>
</html>
